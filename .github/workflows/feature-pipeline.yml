name: Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # every hour, on the hour (UTC)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements-feature.txt
      - run: python -m ipykernel install --user --name python3

      - run: papermill feature_pipeline.ipynb /tmp/feature_pipeline.out.ipynb --log-output
        env:
          HOPSWORKS_KEY: ${{ secrets.HOPSWORKS_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
